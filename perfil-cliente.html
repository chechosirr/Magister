<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi perfil — Magister</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:#0a0c10;color:#fff;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px}
header{background:#2a2a2e;padding:14px 0;margin-bottom:24px}
.hd{max-width:560px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;text-decoration:none;letter-spacing:1px;color:#fff}
.logo .s{background:linear-gradient(135deg,#ffffff,#c9ced6 40%,#8a8f98 60%,#e8ebf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd button{background:none;border:1px solid #2b3049;color:#fff;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer}
h1{font-size:24px;margin-bottom:6px}
.sub{color:#9aa0a8;font-size:14px;margin-bottom:20px}
label{font-size:13px;display:block;margin:14px 0 6px;font-weight:600}
input{width:100%;background:#0a0c13;border:1px solid #2b3049;border-radius:12px;padding:13px 15px;color:#fff;font-family:inherit;font-size:15px}
button.save{width:100%;margin-top:22px;background:linear-gradient(135deg,#ffffff,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4);color:#0a0c10;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
.msg.err{color:#ff8a8a}.msg.ok{color:#7CFC98}
.sec{margin-top:28px}
.sec h2{font-size:18px;margin-bottom:12px}
.fav{background:#12161d;border:1px solid #1e242e;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;text-decoration:none}
.fav .ph{width:48px;height:48px;border-radius:12px;background:#2a2e35;display:grid;place-content:center;font-size:22px;flex:0 0 auto;overflow:hidden}
.fav .ph img{width:100%;height:100%;object-fit:cover}
.fav b{color:#fff;font-size:14px;display:block}
.fav small{color:#9aa0a8;font-size:12px}
.empty{color:#9aa0a8;text-align:center;padding:20px;font-size:14px}
</style>
</head>
<body>
<header><div class="hd">
  <a class="logo" href="./">MAGI<span class="s">STER</span></a>
  <button id="logout">Salir</button>
</div></header>
<div class="wrap">
  <h1>Mi perfil</h1>
  <p class="sub">Tus datos para contactar profesionales.</p>
  <form id="f">
    <label>Nombre completo *</label><input id="nombre" required>
    <label>Teléfono / WhatsApp</label><input id="telefono">
    <label>Ciudad</label><input id="ciudad">
    <button class="save" type="submit" id="btn">Guardar</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="sec">
    <h2>Mis favoritos</h2>
    <div id="favs"><p class="empty">Aún no tienes favoritos.</p></div>
  </div>
</div>
<script>
var SUPABASE_URL = 'https://tyqogeeiflolwpqneroqm.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cW9nZWlmbG9sd3BxbmVyb3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxOTQ4MzQsImV4cCI6MjEwNzc3MDgzNH0.6XSOhs5B_fQkiunJ7tc3ZwhvAZh2-i-nqd5fXY_CyCs';
var sess = null;
try { sess = JSON.parse(localStorage.getItem('magister_session') || 'null'); } catch(e){}
if(!sess || !sess.access_token){ location.href = 'cuenta.html'; }
var tok = sess.access_token;
var uid = sess.user.id;
function h(){ return { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' }; }
// Cargar datos guardados localmente
try {
  var saved = JSON.parse(localStorage.getItem('magister_cliente_' + uid) || '{}');
  if(saved.nombre) document.getElementById('nombre').value = saved.nombre;
  if(saved.telefono) document.getElementById('telefono').value = saved.telefono;
  if(saved.ciudad) document.getElementById('ciudad').value = saved.ciudad;
} catch(e){}
document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  var data = {
    nombre: document.getElementById('nombre').value.trim(),
    telefono: document.getElementById('telefono').value.trim(),
    ciudad: document.getElementById('ciudad').value.trim()
  };
  localStorage.setItem('magister_cliente_' + uid, JSON.stringify(data));
  var msg = document.getElementById('msg');
  msg.className = 'msg ok'; msg.textContent = '¡Guardado!';
  setTimeout(function(){ msg.textContent = ''; }, 2000);
};
// Favoritos
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
try {
  var favs = JSON.parse(localStorage.getItem('magister_favs_' + uid) || '[]');
  if(favs.length){
    document.getElementById('favs').innerHTML = favs.map(function(p){
      return '<a class="fav" href="profesional.html?id=' + p.id + '">'
        + '<div class="ph">' + (p.foto ? '<img src="' + esc(p.foto) + '">' : '👤') + '</div>'
        + '<div><b>' + esc(p.nombre) + '</b><small>' + esc(p.oficio) + '</small></div></a>';
    }).join('');
  }
} catch(e){}
document.getElementById('logout').onclick = function(){
  localStorage.removeItem('magister_session');
  location.href = './';
};
</script>
</body>
</html>
