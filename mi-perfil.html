<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi perfil — Magister</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:#0a0c10;color:#fff;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px}
header{background:#2a2a2e;padding:14px 0;margin-bottom:24px}
.hd{max-width:560px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;text-decoration:none;letter-spacing:1px;color:#fff}
.logo .s{background:linear-gradient(135deg,#ffffff,#c9ced6 40%,#8a8f98 60%,#e8ebf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd button{background:none;border:1px solid #2b3049;color:#fff;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer}
h1{font-size:24px;margin-bottom:20px}
label{font-size:13px;display:block;margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:#0a0c13;border:1px solid #2b3049;border-radius:12px;padding:13px 15px;color:#fff;font-family:inherit;font-size:15px}
textarea{resize:vertical;min-height:90px}
button.save{width:100%;margin-top:22px;background:linear-gradient(135deg,#ffffff,#d9dee6 30%,#a9b2c0 50%,#f2f4f8 70%,#c3cad4);color:#0a0c10;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
.msg.err{color:#ff8a8a}.msg.ok{color:#7CFC98}
.ver{margin-top:16px;text-align:center}
.ver a{color:#9aa0a8;font-size:14px}
</style>
</head>
<body>
<header><div class="hd">
  <a class="logo" href="./">MAGI<span class="s">STER</span></a>
  <button id="logout">Salir</button>
</div></header>
<div class="wrap">
  <h1>Mi perfil profesional</h1>
  <form id="f">
    <label>Nombre completo *</label><input id="nombre" required>
    <label>Especialidad *</label><select id="oficio" required></select>
    <label>Descripción</label><textarea id="descripcion"></textarea>
    <label>WhatsApp *</label><input id="whatsapp" required>
    <label>Ciudad *</label><input id="ciudad" required>
    <label>Departamento *</label><input id="departamento" required>
    <label>Precio desde (USD)</label><input id="precio" type="number" min="0" step="0.01">
    <button class="save" type="submit" id="btn">Guardar</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="ver" id="ver" style="display:none"></div>
</div>
<script>
var SUPABASE_URL = 'https://tyqogeeiflolwpqneroqm.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cW9nZWlmbG9sd3BxbmVyb3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxOTQ4MzQsImV4cCI6MjEwNzc3MDgzNH0.6XSOhs5B_fQkiunJ7tc3ZwhvAZh2-i-nqd5fXY_CyCs';
var OFICIOS = ['Medicina general','Pediatría','Ginecología','Odontología','Dermatología','Cardiología','Oftalmología','Psicología','Fisioterapia','Nutrición','Ortopedia','Neurología','Otro'];
document.getElementById('oficio').innerHTML = '<option value="">Seleccionar...</option>' + OFICIOS.map(function(o){return '<option>'+o+'</option>'}).join('');
var sess = null;
try { sess = JSON.parse(localStorage.getItem('magister_session') || 'null'); } catch(e){}
if(!sess || !sess.access_token){ location.href = 'cuenta.html'; }
var tok = sess.access_token;
var uid = sess.user.id;
function h(){ return { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' }; }
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') + '-' + Math.random().toString(36).slice(2,7); }
var PROF = null;
fetch(SUPABASE_URL + '/rest/v1/profesionales?user_id=eq.' + uid + '&select=*', { headers: h() })
.then(function(r){ return r.json(); }).then(function(rows){
  PROF = (rows || [])[0] || null;
  if(PROF){
    document.getElementById('nombre').value = PROF.nombre || '';
    document.getElementById('oficio').value = PROF.oficio || '';
    document.getElementById('descripcion').value = PROF.descripcion || '';
    document.getElementById('whatsapp').value = PROF.whatsapp || '';
    document.getElementById('ciudad').value = PROF.ciudad || '';
    document.getElementById('departamento').value = PROF.departamento || '';
    document.getElementById('precio').value = PROF.precio_desde || '';
    var v = document.getElementById('ver');
    v.style.display = '';
    v.innerHTML = '<a href="profesional.html?id=' + PROF.id + '">Ver mi perfil público →</a>';
  }
});
document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Guardando...';
  var data = {
    nombre: document.getElementById('nombre').value.trim(),
    oficio: document.getElementById('oficio').value,
    descripcion: document.getElementById('descripcion').value.trim() || null,
    whatsapp: document.getElementById('whatsapp').value.trim(),
    ciudad: document.getElementById('ciudad').value.trim(),
    departamento: document.getElementById('departamento').value.trim(),
    precio_desde: parseFloat(document.getElementById('precio').value) || null,
    user_id: uid
  };
  var req;
  if(PROF){
    req = fetch(SUPABASE_URL + '/rest/v1/profesionales?id=eq.' + PROF.id, { method: 'PATCH', headers: h(), body: JSON.stringify(data) });
  } else {
    data.slug = slug(data.nombre);
    req = fetch(SUPABASE_URL + '/rest/v1/profesionales', { method: 'POST', headers: Object.assign(h(), { 'Prefer': 'return=representation' }), body: JSON.stringify(data) });
  }
  req.then(function(r){
    if(!r.ok) throw new Error();
    return r.json().catch(function(){ return []; });
  }).then(function(rows){
    if(rows && rows[0]) PROF = rows[0];
    msg.className = 'msg ok'; msg.textContent = '¡Guardado!';
    btn.disabled = false; btn.textContent = 'Guardar';
  }).catch(function(){
    msg.className = 'msg err'; msg.textContent = 'No se pudo guardar. Intenta de nuevo.';
    btn.disabled = false; btn.textContent = 'Guardar';
  });
};
document.getElementById('logout').onclick = function(){
  localStorage.removeItem('magister_session');
  location.href = './';
};
</script>
</body>
</html>
