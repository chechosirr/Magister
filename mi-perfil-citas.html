<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi perfil — Magister</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:#0a0c10;color:#fff;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px}
header{background:#2a2a2e;padding:14px 0;margin-bottom:24px}
.hd{max-width:520px;margin:0 auto;padding:0 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;color:#fff;text-decoration:none}
.logo .s{background:linear-gradient(135deg,#ff6b8a,#ff8e53);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd button{background:none;border:1px solid #2b3049;color:#fff;border-radius:10px;padding:8px 14px;font-family:inherit;cursor:pointer}
h1{font-size:24px;margin-bottom:20px}
label{font-size:13px;display:block;margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:#0a0c13;border:1px solid #2b3049;border-radius:12px;padding:13px 15px;color:#fff;font-family:inherit;font-size:15px}
textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.save{width:100%;margin-top:22px;background:linear-gradient(135deg,#ff6b8a,#ff8e53);color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.msg{text-align:center;margin-top:12px;font-size:14px;min-height:20px}
.msg.ok{color:#7CFC98}.msg.err{color:#ff8a8a}
.foto-prev{width:120px;height:120px;border-radius:20px;object-fit:cover;background:#1e242e;display:block;margin-top:8px}
</style>
</head>
<body>
<header><div class="hd"><a class="logo" href="app.html">MAGI<span class="s">STER</span></a><button id="logout">Salir</button></div></header>
<div class="wrap">
  <h1>Mi perfil</h1>
  <form id="f">
    <label>Foto</label><input id="foto" type="file" accept="image/*"><img id="prev" class="foto-prev" style="display:none">
    <label>Nombre *</label><input id="nombre" required maxlength="40">
    <div class="row2">
      <div><label>Edad *</label><input id="edad" type="number" min="18" max="99" required></div>
      <div><label>Ciudad</label><input id="ciudad" maxlength="40"></div>
    </div>
    <div class="row2">
      <div><label>Soy *</label><select id="genero" required><option value="">...</option><option value="hombre">Hombre</option><option value="mujer">Mujer</option></select></div>
      <div><label>Busco *</label><select id="busca" required><option value="">...</option><option value="hombres">Hombres</option><option value="mujeres">Mujeres</option><option value="todos">Todos</option></select></div>
    </div>
    <label>Bio</label><textarea id="bio" maxlength="300" placeholder="Cuéntales algo de ti..."></textarea>
    <button class="save" type="submit" id="btn">Guardar</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
var SUPABASE_URL = 'https://tyqogeeiflolwpqneroqm.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5cW9nZWlmbG9sd3BxbmVyb3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxOTQ4MzQsImV4cCI6MjEwNzc3MDgzNH0.6XSOhs5B_fQkiunJ7tc3ZwhvAZh2-i-nqd5fXY_CyCs';
var sess = null;
try { sess = JSON.parse(localStorage.getItem('magister_session') || 'null'); } catch(e){}
if(!sess || !sess.access_token){ location.href = 'cuenta.html'; }
var tok = sess.access_token, uid = sess.user.id;
function h(ct){ var o = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + tok }; if(ct) o['Content-Type'] = 'application/json'; return o; }
var PROF = null;
document.getElementById('foto').onchange = function(e){
  var f = e.target.files[0];
  if(f){ var r = new FileReader(); r.onload = function(){ var p = document.getElementById('prev'); p.src = r.result; p.style.display = ''; }; r.readAsDataURL(f); }
};
fetch(SUPABASE_URL + '/rest/v1/citas_perfiles?user_id=eq.' + uid + '&select=*', { headers: h() })
.then(function(r){ return r.json(); }).then(function(rows){
  PROF = (rows || [])[0] || null;
  if(PROF){
    document.getElementById('nombre').value = PROF.nombre || '';
    document.getElementById('edad').value = PROF.edad || '';
    document.getElementById('ciudad').value = PROF.ciudad || '';
    document.getElementById('genero').value = PROF.genero || '';
    document.getElementById('busca').value = PROF.busca || '';
    document.getElementById('bio').value = PROF.bio || '';
    if(PROF.foto_url){ var p = document.getElementById('prev'); p.src = PROF.foto_url; p.style.display = ''; }
  }
});
document.getElementById('f').onsubmit = function(e){
  e.preventDefault();
  var msg = document.getElementById('msg'), btn = document.getElementById('btn');
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Guardando...';
  var data = {
    nombre: document.getElementById('nombre').value.trim(),
    edad: parseInt(document.getElementById('edad').value),
    ciudad: document.getElementById('ciudad').value.trim() || null,
    genero: document.getElementById('genero').value,
    busca: document.getElementById('busca').value,
    bio: document.getElementById('bio').value.trim() || null,
    user_id: uid
  };
  var ff = document.getElementById('foto').files[0];
  var up = ff ? (function(){
    var fname = 'cita-' + uid + '-' + Date.now() + '.jpg';
    return fetch(SUPABASE_URL + '/storage/v1/object/citas-fotos/' + fname, {
      method: 'POST', headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + tok }, body: ff
    }).then(function(r){ if(!r.ok) throw 0; return SUPABASE_URL + '/storage/v1/object/public/citas-fotos/' + fname; });
  })() : Promise.resolve(PROF ? PROF.foto_url : null);
  up.then(function(url){
    data.foto_url = url;
    var req = PROF
      ? fetch(SUPABASE_URL + '/rest/v1/citas_perfiles?id=eq.' + PROF.id, { method: 'PATCH', headers: h(true), body: JSON.stringify(data) })
      : fetch(SUPABASE_URL + '/rest/v1/citas_perfiles', { method: 'POST', headers: Object.assign(h(true), { 'Prefer': 'return=representation' }), body: JSON.stringify(data) });
    return req.then(function(r){ if(!r.ok) throw 0; return r.json().catch(function(){ return []; }); });
  }).then(function(rows){
    if(rows[0]) PROF = rows[0];
    msg.className = 'msg ok'; msg.textContent = '¡Guardado!';
    btn.disabled = false; btn.textContent = 'Guardar';
    setTimeout(function(){ location.href = 'app.html'; }, 900);
  }).catch(function(){
    msg.className = 'msg err'; msg.textContent = 'No se pudo guardar.';
    btn.disabled = false; btn.textContent = 'Guardar';
  });
};
document.getElementById('logout').onclick = function(){ localStorage.removeItem('magister_session'); location.href = './'; };
</script>
</body>
</html>
